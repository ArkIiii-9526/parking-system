name: Playwright Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
  schedule:
    # 每天凌晨2点运行测试
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: '选择测试套件'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - dashboard
          - navigation
          - parking
          - vehicle
          - system
          - api

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: |
        if [ "${{ github.event.inputs.test_suite }}" = "all" ] || [ -z "${{ github.event.inputs.test_suite }}" ]; then
          npx playwright test
        else
          npx playwright test tests/e2e/*${{ github.event.inputs.test_suite }}*.spec.js
        fi
      env:
        CI: true

    - name: Generate test report
      if: always()
      run: |
        echo "# Test Results Report" > test-results/report.md
        echo "## Summary" >> test-results/report.md
        echo "- Test Run Date: $(date)" >> test-results/report.md
        echo "- Commit: ${{ github.sha }}" >> test-results/report.md
        echo "- Branch: ${{ github.ref }}" >> test-results/report.md

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-failures
        path: |
          test-results/
        retention-days: 7

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🧪 Playwright Test Results\n\n';
          
          try {
            const results = JSON.parse(fs.readFileSync('test-results/test-results.json', 'utf8'));
            const passed = results.stats?.expected || 0;
            const failed = results.stats?.unexpected || 0;
            const skipped = results.stats?.skipped || 0;
            
            comment += `| Status | Count |\n`;
            comment += `|--------|-------|\n`;
            comment += `| ✅ Passed | ${passed} |\n`;
            comment += `| ❌ Failed | ${failed} |\n`;
            comment += `| ⏭️ Skipped | ${skipped} |\n`;
            comment += `| **Total** | **${passed + failed + skipped}** |\n\n`;
            
            if (failed > 0) {
              comment += '### ❌ Failed Tests\n';
              const failedTests = results.suites?.flatMap(s => s.specs).filter(s => s.ok === false) || [];
              failedTests.forEach(test => {
                comment += `- ${test.title}\n`;
              });
            }
          } catch (e) {
            comment += 'Test results not available.\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  notify:
    name: Notify Test Results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check test status
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ All tests passed!"
        else
          echo "❌ Some tests failed!"
          exit 1
        fi
