name: Playwright TTL Tests

on:
  push:
    branches: [ main, master, develop, 'release/**', 'pre-release/**' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: '运行阶段'
        required: true
        default: 'commit'
        type: choice
        options:
          - commit
          - nightly
          - pre-release
      test_suite:
        description: '指定测试文件(可选)'
        required: false
        default: ''

jobs:
  test:
    name: Run Playwright with TTL Gate
    timeout-minutes: 80
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          repository: ArkIiii-9526/Smart-Parking-Guidance-System-back-end
          path: backend
          token: ${{ secrets.PAT_TOKEN }} # 如果后端是私有仓库，需要配置 PAT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Redis & MySQL Services
        run: |
          docker run -d -p 6379:6379 --name redis redis:alpine
          docker run -d -p 3306:3306 -e MYSQL_ROOT_PASSWORD=123456 -e MYSQL_DATABASE=parking_system --name mysql mysql:8.0
          # 等待 MySQL 就绪
          sleep 15

      - name: Start Backend Service
        run: |
          cd backend
          mvn clean package -DskipTests
          nohup java -jar target/smart-parking-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=test > backend.log 2>&1 &
          
          # 等待后端服务就绪（健康检查）
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8076/api/auth/login > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Attempt $i: Backend not ready, sleeping..."
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Frontend application
        run: npm run build

      - name: Resolve stage and command
        id: resolver
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "test_stage=nightly" >> "$GITHUB_OUTPUT"
            echo "strict_gate=true" >> "$GITHUB_OUTPUT"
            echo "test_command=npx playwright test" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ github.event.inputs.stage }}"
            if [ -n "${{ github.event.inputs.test_suite }}" ]; then
              echo "test_stage=$stage" >> "$GITHUB_OUTPUT"
              echo "strict_gate=true" >> "$GITHUB_OUTPUT"
              echo "test_command=npx playwright test ${{ github.event.inputs.test_suite }}" >> "$GITHUB_OUTPUT"
            elif [ "$stage" = "commit" ]; then
              echo "test_stage=commit" >> "$GITHUB_OUTPUT"
              echo "strict_gate=false" >> "$GITHUB_OUTPUT"
              echo "test_command=npx playwright test tests/e2e/01-login.spec.js tests/e2e/02-dashboard.spec.js tests/e2e/03-navigation.spec.js tests/e2e/07-api-integration.spec.js tests/e2e/08-new-modules-smoke.spec.js" >> "$GITHUB_OUTPUT"
            elif [ "$stage" = "nightly" ]; then
              echo "test_stage=nightly" >> "$GITHUB_OUTPUT"
              echo "strict_gate=true" >> "$GITHUB_OUTPUT"
              echo "test_command=npx playwright test" >> "$GITHUB_OUTPUT"
            else
              echo "test_stage=pre-release" >> "$GITHUB_OUTPUT"
              echo "strict_gate=true" >> "$GITHUB_OUTPUT"
              echo "test_command=npx playwright test" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.ref }}" == refs/heads/release/* || "${{ github.ref }}" == refs/heads/pre-release/* ]]; then
            echo "test_stage=pre-release" >> "$GITHUB_OUTPUT"
            echo "strict_gate=true" >> "$GITHUB_OUTPUT"
            echo "test_command=npx playwright test" >> "$GITHUB_OUTPUT"
          else
            echo "test_stage=commit" >> "$GITHUB_OUTPUT"
            echo "strict_gate=false" >> "$GITHUB_OUTPUT"
            echo "test_command=npx playwright test tests/e2e/01-login.spec.js tests/e2e/02-dashboard.spec.js tests/e2e/03-navigation.spec.js tests/e2e/07-api-integration.spec.js tests/e2e/08-new-modules-smoke.spec.js" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: |
          ${{ steps.resolver.outputs.test_command }}
          echo "test_exit=$?" >> "$GITHUB_OUTPUT"
        env:
          CI: true

      - name: Run TTL quality gate
        id: ttlgate
        if: always()
        continue-on-error: true
        run: |
          node scripts/ttl-quality-gate.js --stage=${{ steps.resolver.outputs.test_stage }} --strict=${{ steps.resolver.outputs.strict_gate }}
          echo "gate_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ttl-report-${{ steps.resolver.outputs.test_stage }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Fail on quality gate
        if: always()
        run: |
          if [ "${{ steps.playwright.outputs.test_exit }}" != "0" ]; then
            echo "Playwright tests failed"
            exit 1
          fi
          if [ "${{ steps.ttlgate.outputs.gate_exit }}" != "0" ]; then
            echo "TTL quality gate failed"
            exit 1
          fi
